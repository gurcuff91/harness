name: Release

# Two triggers into the same job:
#   1. push of a "v*" tag — the automatic path: `make release-push` (see
#      Makefile) pushes the annotated tag it just created, which fires this.
#   2. workflow_dispatch — manual rebuild from the Actions tab. Leave the
#      `tag` input empty to rebuild the latest existing tag (e.g. to publish
#      assets for a release that was tagged before this workflow existed, or
#      to re-run after a transient failure); or specify an exact tag to
#      rebuild that one instead.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (defaults to the latest tag if left empty)'
        required: false

permissions:
  contents: write # gh release create needs this to publish/attach assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — needed to resolve "latest tag" and read CHANGELOG.md at that tag

      - name: Resolve target tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSHED_REF: ${{ github.ref }}
        # Untrusted/dynamic values (the manual dispatch's free-text tag input)
        # are passed in via `env:` above, never interpolated directly into
        # this script — the documented GitHub Actions hardening against
        # script injection via ${{ }} expressions landing in shell code.
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$(git describe --tags --abbrev=0)"
          else
            TAG="${PUSHED_REF#refs/tags/}"
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "❌ Tag $TAG does not exist."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved target tag: $TAG"

      - name: Checkout target tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: git checkout "$TAG"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          VER="${TAG#v}"
          awk "/^## \[$VER\]/{f=1;print;next} /^## \[/{f=0} f" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "❌ No CHANGELOG.md entry found for [$VER] — document the release before publishing."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install X11 dev headers (for linux/amd64's real clipboard backend)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libx11-dev

      - name: Build all platforms
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        # Per-platform CGO_ENABLED, NOT a single blanket setting — clipboard
        # image paste (golang.design/x/clipboard, internal/tui/clipboard.go)
        # is cgo-only on non-Windows, and each target's real feasibility
        # differs:
        #   - linux/amd64: NATIVE build on this runner — cgo works with just
        #     the X11 headers installed above (libX11 itself is dlopen'd at
        #     RUNTIME, per clipboard_linux.c, so build-time headers are
        #     enough; no .so needed here). Real clipboard support.
        #   - linux/arm64: would need a full multiarch cross-toolchain
        #     (dpkg --add-architecture arm64 + ports.ubuntu.com sources +
        #     gcc-aarch64-linux-gnu) for marginal benefit — this target
        #     exists for Raspberry Pi/ARM SERVERS, almost always run
        #     headless over SSH, where an X11 clipboard wouldn't work
        #     anyway even with cgo. Not worth the fragility; CGO_ENABLED=0.
        #   - darwin/amd64, darwin/arm64: cgo needs the Cocoa/Foundation
        #     frameworks (clipboard_darwin.m), which only exist on a real
        #     macOS toolchain — not cross-compilable from this Linux runner
        #     at all. CGO_ENABLED=0 is the only option here.
        #   - windows/amd64: clipboard_windows.go uses syscall/DLLs directly,
        #     no cgo involved regardless — CGO_ENABLED=0 costs nothing.
        # Whichever target ends up cgo-less compiles the library's
        # clipboard_nocgo.go stub instead, whose functions panic if actually
        # invoked at runtime — internal/tui/clipboard.go's initClipboard/
        # PasteImageFromClipboard explicitly recover() from that and report
        # "clipboard not available", exactly like any other init failure
        # (e.g. a headless machine with no X11 session at all).
        run: |
          LDFLAGS="-s -w -X github.com/gurcuff91/harness/internal/version.Version=$TAG"
          mkdir -p dist
          build() {
            local goos=$1 goarch=$2 suffix=$3 cgo=$4
            CGO_ENABLED=$cgo GOOS=$goos GOARCH=$goarch go build -ldflags "$LDFLAGS" -o "dist/harness-$goos-$goarch$suffix" ./cmd/harness
          }
          build darwin  amd64 ""     0
          build darwin  arm64 ""     0
          build linux   amd64 ""     1
          build linux   arm64 ""     0
          build windows amd64 ".exe" 0

      - name: Package archives
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          cd dist
          # Rename each raw binary into its own dir so the archive's internal
          # entry is just "harness" (or "harness.exe"), not "harness-linux-arm64".
          package_unix() {
            local os=$1 arch=$2
            mkdir -p "$os-$arch" && mv "harness-$os-$arch" "$os-$arch/harness"
            chmod +x "$os-$arch/harness"
            tar -czf "harness-${TAG}-${os}-${arch}.tar.gz" -C "$os-$arch" harness
            rm -rf "$os-$arch"
          }
          package_windows() {
            local os=$1 arch=$2
            mkdir -p "$os-$arch" && mv "harness-$os-$arch.exe" "$os-$arch/harness.exe"
            (cd "$os-$arch" && zip -q "../harness-${TAG}-${os}-${arch}.zip" harness.exe)
            rm -rf "$os-$arch"
          }
          package_unix darwin amd64
          package_unix darwin arm64
          package_unix linux amd64
          package_unix linux arm64
          package_windows windows amd64
          ls -lh .

      - name: Generate checksums
        run: |
          cd dist
          sha256sum harness-*.tar.gz harness-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          # `gh release create` has no "replace if exists" flag (that's
          # `gh release upload --clobber`, a different subcommand, for
          # uploading to an ALREADY-created release) — so a manual re-run
          # over a tag that already has a Release (workflow_dispatch,
          # rebuilding after a transient failure) deletes the existing
          # Release first. --cleanup-tag is deliberately omitted: this only
          # removes the GitHub Release entity, never the underlying git tag
          # `make release` created.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — deleting it before re-publishing."
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" \
            dist/harness-*.tar.gz dist/harness-*.zip dist/SHA256SUMS.txt \
            --title "$TAG" \
            --notes-file release-notes.md
