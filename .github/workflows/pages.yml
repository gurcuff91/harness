name: Documentation

# Builds docs/page (Markdown → static site, standard library only) and publishes
# it to GitHub Pages (https://gurcuff91.github.io/harness/). It runs when the
# documentation changes, and by hand. The build fails on a broken link, so a
# page that points nowhere cannot be published.
on:
  push:
    branches: [main]
    paths: ["docs/page/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/configure-pages@v5
      - name: The generated reference pages must be up to date
        run: |
          make docs-generate
          git diff --exit-code -- docs/page/content rpc/schema.json || {
            echo "::error::A generated page is stale. Run 'make docs' and commit the result."
            exit 1
          }
      - name: Build the site
        run: make docs-build DOCS_BASE=/harness
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/page/dist
      - id: deployment
        uses: actions/deploy-pages@v4
