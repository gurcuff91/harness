name: Test

# Runs the OS-specific code on the systems it is written for. The release
# workflow only builds Windows and macOS binaries on Linux; this is where their
# platform code actually executes (the process liveness check behind
# input-channel claims, agent/proc_*.go). Not a release gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Process liveness and channel claims
        run: go test ./agent ./internal/config -run "OwnerAlive|ProcLookup|ReusedPid|AnotherUsers|Claim|Release|Conversation" -count=1 -v
